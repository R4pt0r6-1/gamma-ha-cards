<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamma HA Cards Demo</title>
    <script type="module" src="/src/index.ts"></script>
    <style>
      :root {
        --primary-text-color: #f4f7fb;
        --secondary-text-color: #aeb8c6;
        --divider-color: rgb(255 255 255 / 12%);
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 18% 18%, #24415f, transparent 34%),
          radial-gradient(circle at 82% 15%, #463a4a, transparent 38%),
          #080b10;
        color: var(--primary-text-color);
        display: flex;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        display: grid;
        gap: 26px;
        width: min(620px, calc(100vw - 32px));
      }

      .demo-section {
        display: grid;
        gap: 12px;
      }

      .group-title {
        align-items: center;
        color: #d8dee8;
        display: flex;
        font-size: 14px;
        gap: 8px;
        margin: 0;
      }

      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      @media (max-width: 620px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="demo-section">
        <h1 class="group-title">Lights</h1>
        <div class="grid">
          <glow-light-card id="lanai"></glow-light-card>
          <glow-light-card id="bar"></glow-light-card>
        </div>
      </section>

      <section class="demo-section">
        <h2 class="group-title">Switches</h2>
        <div class="grid">
          <glow-switch-card id="coffee-maker"></glow-switch-card>
          <glow-switch-card id="air-purifier"></glow-switch-card>
        </div>
      </section>

      <section class="demo-section">
        <h2 class="group-title">Locks</h2>
        <div class="grid">
          <glow-lock-card id="front-door"></glow-lock-card>
          <glow-lock-card id="garage-entry"></glow-lock-card>
        </div>
      </section>

      <section class="demo-section">
        <h2 class="group-title">Thermostats</h2>
        <div class="grid">
          <glow-thermostat-card id="hallway-thermostat"></glow-thermostat-card>
          <glow-thermostat-card id="bedroom-thermostat"></glow-thermostat-card>
        </div>
      </section>

      <section class="demo-section">
        <h2 class="group-title">Outlets</h2>
        <dual-outlet-card id="desk-outlets"></dual-outlet-card>
      </section>

      <section class="demo-section">
        <h2 class="group-title">Fans</h2>
        <div class="grid">
          <speed-fan-card id="kitchen-fan"></speed-fan-card>
          <speed-fan-card id="office-fan"></speed-fan-card>
        </div>
      </section>
    </main>

    <script type="module">
      if (!customElements.get('ha-card')) {
        customElements.define('ha-card', class extends HTMLElement {});
      }

      if (!customElements.get('ha-icon')) {
        customElements.define(
          'ha-icon',
          class extends HTMLElement {
            #icon = '';

            static get observedAttributes() {
              return ['icon'];
            }

            get icon() {
              return this.#icon || this.getAttribute('icon') || '';
            }

            set icon(value) {
              this.#icon = value || '';
              this.render();
            }

            connectedCallback() {
              this.render();
            }

            attributeChangedCallback() {
              this.render();
            }

            render() {
              const icon = this.icon;
              this.textContent = icon.includes('tune')
                ? '≋'
                : icon.includes('power-cycle')
                ? '↻'
                : icon.includes('power')
                  ? '⏻'
                : icon.includes('leaf')
                  ? '⌁'
                : icon.includes('arrow-up-down')
                  ? '↕'
                : icon.includes('arrow-left-right')
                  ? '↔'
                : icon.includes('weather-night')
                  ? '☾'
                : icon.includes('air-filter')
                  ? '▥'
                : icon.includes('alert')
                  ? '!'
                : icon.includes('monitor')
                  ? '▣'
                : icon.includes('outdoor')
                ? '↪'
                : icon.includes('ceiling')
                  ? '▣'
                  : icon.includes('socket')
                  ? '▤'
                  : icon.includes('fan')
                    ? '✢'
                    : icon.includes('toggle')
                      ? '⏻'
                    : icon.includes('lock')
                      ? '▣'
                    : icon.includes('thermostat')
                      ? '◉'
                    : icon.includes('power')
                      ? '⏻'
                  : '●';
            }
          },
        );
      }

      const states = {
        'light.lanai_lights': {
          entity_id: 'light.lanai_lights',
          state: 'off',
          attributes: {
            friendly_name: 'Lanai Lights',
            brightness: 0,
          },
        },
        'light.bar_lights': {
          entity_id: 'light.bar_lights',
          state: 'on',
          attributes: {
            friendly_name: 'Bar Lights',
            brightness: 186,
          },
        },
        'switch.desk_outlet_top': {
          entity_id: 'switch.desk_outlet_top',
          state: 'on',
          attributes: {
            friendly_name: 'Top Outlet',
            icon: 'mdi:power-socket-us',
          },
        },
        'switch.desk_outlet_bottom': {
          entity_id: 'switch.desk_outlet_bottom',
          state: 'off',
          attributes: {
            friendly_name: 'Bottom Outlet',
            icon: 'mdi:power-socket-us',
          },
        },
        'switch.coffee_maker': {
          entity_id: 'switch.coffee_maker',
          state: 'on',
          attributes: {
            friendly_name: 'Coffee Maker',
            icon: 'mdi:coffee-maker',
          },
        },
        'switch.air_purifier': {
          entity_id: 'switch.air_purifier',
          state: 'off',
          attributes: {
            friendly_name: 'Air Purifier',
            icon: 'mdi:air-purifier',
          },
        },
        'lock.front_door': {
          entity_id: 'lock.front_door',
          state: 'locked',
          attributes: {
            friendly_name: 'Front Door',
            icon: 'mdi:lock',
          },
        },
        'lock.garage_entry': {
          entity_id: 'lock.garage_entry',
          state: 'unlocked',
          attributes: {
            friendly_name: 'Garage Entry',
            icon: 'mdi:lock-open-variant',
          },
        },
        'climate.hallway': {
          entity_id: 'climate.hallway',
          state: 'heat',
          attributes: {
            friendly_name: 'Hallway',
            current_temperature: 69,
            temperature: 72,
            min_temp: 55,
            max_temp: 85,
            temperature_unit: '°F',
            hvac_action: 'heating',
            icon: 'mdi:thermostat',
          },
        },
        'climate.bedroom': {
          entity_id: 'climate.bedroom',
          state: 'cool',
          attributes: {
            friendly_name: 'Bedroom',
            current_temperature: 74,
            temperature: 70,
            min_temp: 55,
            max_temp: 85,
            temperature_unit: '°F',
            hvac_action: 'cooling',
            icon: 'mdi:thermostat',
          },
        },
        'climate.lanai_ac': {
          entity_id: 'climate.lanai_ac',
          state: 'cool',
          attributes: {
            friendly_name: 'Lanai Air conditioner',
            current_temperature: 79,
            temperature: 71,
            min_temp: 61,
            max_temp: 88,
            temperature_unit: '°F',
            hvac_modes: ['off', 'heat_cool', 'cool', 'heat', 'fan_only', 'dry'],
            fan_modes: ['auto', 'quiet', 'low', 'medlow', 'medium', 'medhigh', 'high', 'strong'],
            swing_modes: ['off', 'Full', 'Upper', 'Lower'],
            swing_horizontal_modes: ['off', 'Full', 'Left', 'Center', 'Right'],
            fan_mode: 'quiet',
            swing_mode: 'off',
            swing_horizontal_mode: 'off',
            air_quality: 'great',
            icon: 'mdi:air-conditioner',
          },
        },
        'binary_sensor.lanai_air_conditioner_filter': {
          entity_id: 'binary_sensor.lanai_air_conditioner_filter',
          state: 'on',
          attributes: {
            friendly_name: 'Lanai Air conditioner Filter',
            device_class: 'problem',
          },
        },
        'binary_sensor.lanai_air_conditioner_problem': {
          entity_id: 'binary_sensor.lanai_air_conditioner_problem',
          state: 'off',
          attributes: {
            friendly_name: 'Lanai Air conditioner Problem',
            device_class: 'problem',
            fault_code: 0,
          },
        },
        'light.lanai_air_conditioner_display': {
          entity_id: 'light.lanai_air_conditioner_display',
          state: 'on',
          attributes: {
            friendly_name: 'Lanai Air conditioner Display',
          },
        },
        'select.lanai_air_conditioner_sleep_mode': {
          entity_id: 'select.lanai_air_conditioner_sleep_mode',
          state: 'Off',
          attributes: {
            friendly_name: 'Lanai Air conditioner Sleep mode',
            options: ['Off', 'Standard', 'Elderly', 'Child'],
            icon: 'mdi:weather-night',
          },
        },
        'select.lanai_air_conditioner_vertical_position': {
          entity_id: 'select.lanai_air_conditioner_vertical_position',
          state: 'Unknown',
          attributes: {
            friendly_name: 'Lanai Air conditioner Vertical position',
            options: ['Unknown', 'Top', 'Slightly up', 'Middle', 'Slightly down', 'Bottom'],
            icon: 'mdi:unfold-more-horizontal',
          },
        },
        'select.lanai_air_conditioner_horizontal_position': {
          entity_id: 'select.lanai_air_conditioner_horizontal_position',
          state: 'Unknown',
          attributes: {
            friendly_name: 'Lanai Air conditioner Horizontal position',
            options: ['Unknown', 'Leftmost', 'Slight Left', 'Center', 'Slight Right', 'Rightmost'],
            icon: 'mdi:unfold-more-vertical',
          },
        },
        'sensor.lanai_air_conditioner_pm2_5': {
          entity_id: 'sensor.lanai_air_conditioner_pm2_5',
          state: '0',
          attributes: {
            friendly_name: 'Lanai Air conditioner PM2.5',
            unit_of_measurement: 'μg/m³',
            device_class: 'pm25',
          },
        },
        'switch.lanai_air_conditioner_anti_frost': {
          entity_id: 'switch.lanai_air_conditioner_anti_frost',
          state: 'off',
          attributes: { friendly_name: 'Lanai Air conditioner Anti-frost' },
        },
        'switch.lanai_air_conditioner_anti_mildew': {
          entity_id: 'switch.lanai_air_conditioner_anti_mildew',
          state: 'off',
          attributes: {
            friendly_name: 'Lanai Air conditioner Anti-mildew',
            icon: 'mdi:water-off-outline',
          },
        },
        'switch.lanai_air_conditioner_eco_mode': {
          entity_id: 'switch.lanai_air_conditioner_eco_mode',
          state: 'off',
          attributes: {
            friendly_name: 'Lanai Air conditioner Eco mode',
            icon: 'mdi:leaf',
          },
        },
        'switch.lanai_air_conditioner_health': {
          entity_id: 'switch.lanai_air_conditioner_health',
          state: 'off',
          attributes: {
            friendly_name: 'Lanai Air conditioner Health',
            icon: 'mdi:heart-outline',
          },
        },
        'switch.lanai_air_conditioner_soft_wind': {
          entity_id: 'switch.lanai_air_conditioner_soft_wind',
          state: 'off',
          attributes: {
            friendly_name: 'Lanai Air conditioner Soft wind',
            icon: 'mdi:weather-windy',
          },
        },
        'switch.lanai_air_conditioner_sound': {
          entity_id: 'switch.lanai_air_conditioner_sound',
          state: 'on',
          attributes: { friendly_name: 'Lanai Air conditioner Sound' },
        },
        'fan.kitchen_fan': {
          entity_id: 'fan.kitchen_fan',
          state: 'off',
          attributes: {
            friendly_name: 'Kitchen Fan',
            percentage: 0,
            icon: 'mdi:fan',
          },
        },
        'fan.office_fan': {
          entity_id: 'fan.office_fan',
          state: 'on',
          attributes: {
            friendly_name: 'Office Fan',
            percentage: 100,
            icon: 'mdi:fan',
          },
        },
      };

      const hass = {
        states,
        callService(domain, service, data) {
          const entity = states[data.entity_id];
          if (!entity) return;

          if (domain === 'fan' && service === 'set_percentage') {
            entity.state = Number(data.percentage) > 0 ? 'on' : 'off';
            entity.attributes.percentage = Number(data.percentage);
          } else if (domain === 'fan' && service === 'turn_on' && data.percentage !== undefined) {
            entity.state = Number(data.percentage) > 0 ? 'on' : 'off';
            entity.attributes.percentage = Number(data.percentage);
          } else if (domain === 'lock' && service === 'lock') {
            entity.state = 'locked';
          } else if (domain === 'lock' && service === 'unlock') {
            entity.state = 'unlocked';
          } else if (domain === 'climate' && service === 'set_temperature') {
            entity.attributes.temperature = Number(data.temperature);
          } else if (domain === 'climate' && service === 'set_hvac_mode') {
            entity.state = String(data.hvac_mode);
            entity.attributes.hvac_action =
              entity.state === 'heat'
                ? 'heating'
                : entity.state === 'cool'
                  ? 'cooling'
                  : 'idle';
          } else if (domain === 'climate' && service === 'set_fan_mode') {
            entity.attributes.fan_mode = data.fan_mode;
          } else if (domain === 'climate' && service === 'set_swing_mode') {
            entity.attributes.swing_mode = data.swing_mode;
          } else if (domain === 'climate' && service === 'set_swing_horizontal_mode') {
            entity.attributes.swing_horizontal_mode = data.swing_horizontal_mode;
          } else if (domain === 'select' && service === 'select_option') {
            entity.state = data.option;
          } else if (service === 'turn_off') {
            entity.state = 'off';
            if (entity.attributes.percentage !== undefined) {
              entity.attributes.percentage = 0;
            }
            if (entity.attributes.brightness !== undefined) {
              entity.attributes.brightness = 0;
            }
          } else if (service === 'turn_on') {
            entity.state = 'on';
            if (entity.attributes.brightness !== undefined && data.brightness_pct !== undefined) {
              entity.attributes.brightness = Math.round((Number(data.brightness_pct) / 100) * 255);
            }
          } else if (service === 'toggle') {
            entity.state = entity.state === 'on' ? 'off' : 'on';
            if (entity.attributes.brightness !== undefined) {
              entity.attributes.brightness = entity.state === 'on' ? 255 : 0;
            }
          } else {
            return;
          }

          document
            .querySelectorAll(
              'glow-light-card, glow-switch-card, glow-lock-card, glow-thermostat-card, dual-outlet-card, speed-fan-card',
            )
            .forEach((card) => {
              card.hass = { ...hass, states: { ...states } };
            });
        },
      };

      const lanai = document.querySelector('#lanai');
      lanai.setConfig({
        entity: 'light.lanai_lights',
        icon: 'mdi:outdoor-lamp',
      });
      lanai.hass = hass;

      const bar = document.querySelector('#bar');
      bar.setConfig({
        entity: 'light.bar_lights',
        icon: 'mdi:ceiling-light',
        width: '100%',
        has_dimmer: true,
      });
      bar.hass = hass;

      const coffeeMaker = document.querySelector('#coffee-maker');
      coffeeMaker.setConfig({
        entity: 'switch.coffee_maker',
        icon: 'mdi:coffee-maker',
        width: '100%',
      });
      coffeeMaker.hass = hass;

      const airPurifier = document.querySelector('#air-purifier');
      airPurifier.setConfig({
        entity: 'switch.air_purifier',
        icon: 'mdi:air-purifier',
        width: '100%',
      });
      airPurifier.hass = hass;

      const frontDoor = document.querySelector('#front-door');
      frontDoor.setConfig({
        entity: 'lock.front_door',
        width: '100%',
      });
      frontDoor.hass = hass;

      const garageEntry = document.querySelector('#garage-entry');
      garageEntry.setConfig({
        entity: 'lock.garage_entry',
        width: '100%',
      });
      garageEntry.hass = hass;

      const hallwayThermostat = document.querySelector('#hallway-thermostat');
      hallwayThermostat.setConfig({
        entity: 'climate.hallway',
        width: '100%',
      });
      hallwayThermostat.hass = hass;

      const bedroomThermostat = document.querySelector('#bedroom-thermostat');
      bedroomThermostat.setConfig({
        entity: 'climate.lanai_ac',
        name: 'Lanai AC',
        width: '100%',
        height: '500px',
        show_features: true,
        filter_entity: 'binary_sensor.lanai_air_conditioner_filter',
        problem_entity: 'binary_sensor.lanai_air_conditioner_problem',
        pm25_entity: 'sensor.lanai_air_conditioner_pm2_5',
        display_light_entity: 'light.lanai_air_conditioner_display',
        sleep_mode_entity: 'select.lanai_air_conditioner_sleep_mode',
        vertical_position_entity: 'select.lanai_air_conditioner_vertical_position',
        horizontal_position_entity: 'select.lanai_air_conditioner_horizontal_position',
        anti_frost_switch_entity: 'switch.lanai_air_conditioner_anti_frost',
        anti_mildew_switch_entity: 'switch.lanai_air_conditioner_anti_mildew',
        eco_switch_entity: 'switch.lanai_air_conditioner_eco_mode',
        health_switch_entity: 'switch.lanai_air_conditioner_health',
        soft_wind_switch_entity: 'switch.lanai_air_conditioner_soft_wind',
        sound_switch_entity: 'switch.lanai_air_conditioner_sound',
      });
      bedroomThermostat.hass = hass;

      const deskOutlets = document.querySelector('#desk-outlets');
      deskOutlets.setConfig({
        title: 'Desk Outlets',
        entity_1: 'switch.desk_outlet_top',
        entity_2: 'switch.desk_outlet_bottom',
        icon_1: 'mdi:power-socket-us',
        icon_2: 'mdi:power-socket-us',
        width: '320px',
        layout: 'duplex',
        on_color: '#ff3b30',
      });
      deskOutlets.hass = hass;

      const kitchenFan = document.querySelector('#kitchen-fan');
      kitchenFan.setConfig({
        entity: 'fan.kitchen_fan',
        name: 'Fan',
        width: '100%',
      });
      kitchenFan.hass = hass;

      const officeFan = document.querySelector('#office-fan');
      officeFan.setConfig({
        entity: 'fan.office_fan',
        name: 'Fan',
        width: '100%',
      });
      officeFan.hass = hass;
    </script>
  </body>
</html>
